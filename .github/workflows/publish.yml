name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run tests
        run: deno task test
      - name: Lint
        run: deno task lint
      - name: Format check
        run: deno task fmt:check
      - name: Publish to JSR
        run: deno publish
